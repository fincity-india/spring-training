spring.application.name=gateway
server.port=8080

# Optional: Route config (example)
spring.cloud.gateway.routes[0].id=config-service
spring.cloud.gateway.routes[0].uri=lb://CONFIG-SERVER
spring.cloud.gateway.routes[0].predicates[0]=Path=/config/**

# Strip prefix so that /config/** becomes /** for target service
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
